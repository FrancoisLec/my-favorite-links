<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="common.css">
  <style>
    body { width: 360px; padding: 12px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    header strong { flex: 1; font-size: 15px; }
    header .star { color: var(--star); font-size: 18px; }
    .actions { margin-top: 4px; }
    .status { font-size: 12px; color: var(--muted); margin-left: auto; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
    .results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 340px; overflow-y: auto; }
    [hidden] { display: none !important; }
    .addbar { display: flex; align-items: center; gap: 10px; }
    .addbar .status { margin-left: 0; }
    #saveForm { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 10px 8px; }
    .form-actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .form-actions .spacer { flex: 1; }
    #formMsg { color: var(--danger); margin-left: 0; }
    .results li a {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px;
      color: var(--text); text-decoration: none;
    }
    .results li a:hover, .results li a:focus { background: var(--surface-2); outline: none; }
    .r-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .r-domain { color: var(--muted); font-size: 11px; flex: none; }
    .empty { color: var(--muted); font-size: 12px; padding: 6px 8px; }
    label.check { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
    label.check input { width: auto; margin: 0; }
    .r-star { color: var(--star); flex: none; }
  </style>
</head>
<body>
  <header>
    <span class="star">★</span>
    <strong>My Favorite Links</strong>
    <button id="openManager" class="btn ghost small" title="Open the full manager">Open all ↗</button>
    <button id="openAbout" class="btn ghost small" title="About & support">ⓘ</button>
  </header>

  <div id="addBar" class="addbar">
    <button type="button" id="addToggle" class="btn primary">+ Add link</button>
    <span id="status" class="status"></span>
  </div>

  <form id="saveForm" autocomplete="off" hidden>
    <label>Title <input id="title" required></label>
    <label>URL <input id="url" inputmode="url" spellcheck="false" required></label>
    <label>Folder
      <select id="category" class="field"></select>
      <input id="newFolder" class="new-folder" placeholder="New folder name" hidden>
    </label>
    <label>Tags <span class="hint">(comma separated)</span> <input id="tags" placeholder="work, xerox, docs"></label>
    <label class="check"><input type="checkbox" id="fav"> ★ Add to Favorites</label>
    <div class="form-actions">
      <button type="submit" id="saveBtn" class="btn primary">Save</button>
      <button type="button" id="cancelBtn" class="btn">Cancel</button>
      <span id="formMsg" class="status"></span>
      <span class="spacer"></span>
      <button type="button" id="removeBtn" class="btn danger" hidden>Remove</button>
    </div>
  </form>

  <hr>
  <input id="search" type="search" placeholder="Search your links…">
  <ul id="results" class="results"></ul>

  <script type="module" src="popup.js"></script>
</body>
</html>
